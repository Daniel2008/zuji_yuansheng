plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.damors.zuji'
    compileSdk 35

    defaultConfig {
        // 统一环境配置加载逻辑
        // Unified environment configuration loading logic
        Properties appProperties = new Properties()
        
        // 读取统一配置文件
        // Read unified configuration file
        def configFile = "config/app.properties"
        if (rootProject.file(configFile).exists()) {
            appProperties.load(rootProject.file(configFile).newDataInputStream())
            println "已加载应用配置文件: ${configFile}"
            println "Loaded application config file: ${configFile}"
        } else {
            println "错误: 配置文件 ${configFile} 不存在!"
            println "Error: Configuration file ${configFile} does not exist!"
            throw new GradleException("Required configuration file ${configFile} is missing")
        }
        
        // 直接从配置文件获取属性值的辅助函数
        // Helper function to get property values directly from config file
        def getProperty = { key, defaultValue = "" ->
            return appProperties.getProperty(key, defaultValue)
        }
        
        applicationId "com.damors.zuji"
        minSdk 24
        targetSdk 34
        versionCode getProperty("versionCode", "1").toInteger()
        versionName getProperty("versionName", "1.0")
        
        println "版本代码 Version Code: ${getProperty('versionCode')}"
        println "版本名称 Version Name: ${getProperty('versionName')}"
        
        // 将配置添加到BuildConfig中，方便代码中使用
        // Add configuration to BuildConfig for use in code
        buildConfigField "boolean", "PRO_MODE", getProperty("proMode", "false")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters  "armeabi-v7a", "arm64-v8a"
        }
    }

    // 启用BuildConfig功能
    // Enable BuildConfig feature
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        //打包后应用名称
        applicationVariants.all { variant ->
            variant.outputs.all { output ->
                def outputFile = output.outputFile
                def fileName
                if (outputFile != null && outputFile.name.endsWith('.apk')) {
                    if (variant.buildType.name.equals('release')) {//如果是release包
                        fileName = "com.damors.zuji_release_v${defaultConfig.versionName}.apk"
                    } else if (variant.buildType.name.equals('debug')) {//如果是debug包
                        fileName = "com.damors.zuji_debug_v${defaultConfig.versionName}.apk"
                    }
                    outputFileName = fileName
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

// 添加自定义Gradle任务
// Add custom Gradle tasks
task showEnvironmentConfig {
    group = 'environment'
    description = '显示当前环境配置信息 (Show current environment configuration)'
    
    doLast {
        println "\n========================================"
        println "当前环境配置信息 Current Environment Configuration"
        println "========================================"
        
        // 读取配置文件
        Properties appProperties = new Properties()
        def configFile = "config/app.properties"
        
        if (rootProject.file(configFile).exists()) {
            appProperties.load(rootProject.file(configFile).newDataInputStream())
        }
        
        // 获取配置值的辅助函数
        def getProperty = { key, defaultValue = "N/A" ->
            return appProperties.getProperty(key, defaultValue)
        }
        
        println "配置文件 Config File: ${configFile}"
        println "========================================"
        println "版本信息 Version Information:"
        println "  版本代码 Version Code: ${getProperty('versionCode')}"
        println "  版本名称 Version Name: ${getProperty('versionName')}"
        println "环境设置 Environment Settings:"
        println "  正式模式 Pro Mode: ${getProperty('proMode')}"
        println "========================================\n"
    }
}

// 环境切换任务已移除，因为当前配置文件不支持多环境
// Environment switching tasks removed as current config file doesn't support multiple environments

